# =============================================================================
# CI/CD Pipeline Simple - Proyecto Final DevOps
# Curso: Introducción a DevOps
# App: Store Management API (Python FastAPI)
# =============================================================================

name: 🚀 CI/CD Simple Pipeline

# ¿CUÁNDO SE EJECUTA?
# Solo cuando hacemos push a la rama main (después de un merge desde develop)
on:
  push:
    branches: [main]
  
  # Botón manual para emergencias
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Forzar deployment'
        required: false
        default: 'false'

# PERMISOS NECESARIOS - Para crear tags y leer repositorio
permissions:
  contents: write         # Crear tags de versión
  packages: write         # Subir paquetes si es necesario
  actions: read          # Leer otros workflows

# VARIABLES GLOBALES
env:
  APP_NAME: "app-fastapi"
  PYTHON_VERSION: ${{ vars.PYTHON_VERSION }}
  
  # TODO: Cambiar por tu URL de Nexus
  NEXUS_URL: ${{ vars.NEXUS_URL }}
  NEXUS_PORT: ${{ vars.NEXUS_PORT }}

# =============================================================================
# JOBS DEL PIPELINE (Se ejecutan en orden)
# =============================================================================
jobs:

  # ---------------------------------------------------------------------------
  # JOB 1: PREPARAR - Calcular la nueva versión
  # ---------------------------------------------------------------------------
  prepare:
    name: 🎯 Preparar Release
    runs-on: ubuntu-latest
    
    outputs:
      version: ${{ steps.version.outputs.version }}
      
    steps:
      - name: 📥 Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para ver el historial de Git
          
      - name: 🏷️ Calcular nueva versión
        id: version
        run: |
          # Buscar la última versión o empezar en v1.0.0
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          echo "Última versión encontrada: $LAST_TAG"
          
          # Incrementar la versión automáticamente
          if [[ $LAST_TAG =~ v([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            MAJOR=${BASH_REMATCH[1]}
            MINOR=${BASH_REMATCH[2]}
            PATCH=$((${BASH_REMATCH[3]} + 1))
            NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          else
            NEW_VERSION="v1.0.1"
          fi
          
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "🎉 Nueva versión será: $NEW_VERSION"

  # ---------------------------------------------------------------------------
  # JOB 2: TESTS - Verificar que el código funciona
  # ---------------------------------------------------------------------------
  test:
    name: 🧪 Ejecutar Tests
    runs-on: ubuntu-latest
    needs: prepare
    
    steps:
      - name: 📥 Descargar código
        uses: actions/checkout@v4
        
      - name: 🐍 Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'  # Cache para ir más rápido
          
      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov black flake8
          
      - name: 🎨 Verificar formato del código
        run: |
          echo "Verificando que el código esté bien formateado..."
          black --check app/ tests/ || echo "⚠️ Código necesita formateo"
          flake8 app/ tests/ --max-line-length=88 || echo "⚠️ Hay problemas de estilo"
          
      - name: ✅ Ejecutar tests unitarios
        run: |
          echo "Ejecutando tests..."
          pytest tests/ -v --cov=app --cov-report=term-missing
          echo "✅ Tests completados!"

  # ---------------------------------------------------------------------------
  # JOB 3: BUILD - Crear la imagen Docker
  # ---------------------------------------------------------------------------
  build:
    name: 🐳 Construir Imagen Docker
    runs-on: ubuntu-latest
    needs: [prepare, test]
    
    steps:
      - name: 📥 Descargar código
        uses: actions/checkout@v4
        
      - name: 🔧 Configurar Docker
        uses: docker/setup-buildx-action@v3
        
      - name: 🏷️ Generar tags para la imagen
        id: meta
        run: |
          VERSION=${{ needs.prepare.outputs.version }}
          REGISTRY="${{ env.NEXUS_URL }}:${{ env.NEXUS_PORT }}"
          
          echo "image_tag=${REGISTRY}/${{ env.APP_NAME }}:${VERSION}" >> $GITHUB_OUTPUT
          echo "image_latest=${REGISTRY}/${{ env.APP_NAME }}:latest" >> $GITHUB_OUTPUT
          
          echo "🐳 Imagen será: ${REGISTRY}/${{ env.APP_NAME }}:${VERSION}"
          
      - name: 🔨 Construir imagen Docker
        run: |
          echo "Construyendo imagen Docker..."
          docker build \
            -t ${{ steps.meta.outputs.image_tag }} \
            -t ${{ steps.meta.outputs.image_latest }} \
            --label "version=${{ needs.prepare.outputs.version }}" \
            --label "app=${{ env.APP_NAME }}" \
            .
          
          echo "✅ Imagen construida exitosamente!"
          
      - name: 💾 Guardar imagen para usar después
        run: |
          docker save ${{ steps.meta.outputs.image_tag }} > /tmp/app-image.tar
          
      - name: 📤 Subir imagen como artefacto temporal
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/app-image.tar
          retention-days: 1

  # ---------------------------------------------------------------------------
  # JOB 4: SECURITY - Escanear vulnerabilidades (opcional)
  # ---------------------------------------------------------------------------
  security:
    name: 🛡️ Escaneo de Seguridad
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ vars.ENABLE_SECURITY_SCAN != 'false' }}
    
    steps:
      - name: 📥 Descargar imagen
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp/
          
      - name: 🔧 Cargar imagen Docker
        run: |
          docker load --input /tmp/app-image.tar
          docker images
          
      - name: 🔍 Escanear vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.NEXUS_URL }}:${{ env.NEXUS_PORT }}/${{ env.APP_NAME }}:${{ needs.prepare.outputs.version }}'
          format: 'table'
          exit-code: '0'  # No fallar el pipeline por vulnerabilidades
          
      - name: 📊 Resultado del escaneo
        run: |
          echo "🛡️ Escaneo de seguridad completado"
          echo "ℹ️ Revisar logs arriba para ver vulnerabilidades encontradas"

  # ---------------------------------------------------------------------------
  # JOB 5: PUBLISH - Subir imagen a Nexus
  # ---------------------------------------------------------------------------
  publish:
    name: 📦 Publicar en Nexus
    runs-on: ubuntu-latest
    needs: [prepare, build, security]
    if: always() && needs.build.result == 'success'
    
    steps:
      - name: 📥 Descargar imagen
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp/
          
      - name: 🔧 Cargar imagen Docker
        run: |
          docker load --input /tmp/app-image.tar
          
      - name: 🔐 Login a Nexus
        run: |
          echo "Conectando a Nexus..."
          # TODO: Configurar NEXUS_USERNAME y NEXUS_PASSWORD en GitHub Secrets
          echo "${{ secrets.NEXUS_PASSWORD }}" | docker login ${{ env.NEXUS_URL }}:${{ env.NEXUS_PORT }} -u "${{ secrets.NEXUS_USERNAME }}" --password-stdin
          
      - name: 📤 Subir imagen a Nexus
        run: |
          echo "Subiendo imagen a Nexus..."
          docker push ${{ env.NEXUS_URL }}:${{ env.NEXUS_PORT }}/${{ env.APP_NAME }}:${{ needs.prepare.outputs.version }}
          docker push ${{ env.NEXUS_URL }}:${{ env.NEXUS_PORT }}/${{ env.APP_NAME }}:latest
          echo "✅ Imagen subida exitosamente!"
          
      - name: 🏷️ Crear tag en Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag ${{ needs.prepare.outputs.version }}
          git push origin ${{ needs.prepare.outputs.version }}

  # ---------------------------------------------------------------------------
  # JOB 6: DEPLOY - Desplegar en EC2
  # ---------------------------------------------------------------------------
  deploy:
    name: 🚀 Desplegar en EC2
    runs-on: ubuntu-latest
    needs: [prepare, publish]
    
    steps:
      - name: 📥 Descargar código (para docker-compose)
        uses: actions/checkout@v4
        
      - name: 🔧 Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy-key
          chmod 600 ~/.ssh/deploy-key
          
      - name: 🚀 Ejecutar deployment en EC2
        run: |
          echo "🚀 Iniciando deployment en EC2..."
          
          # Variables para el deployment
          VERSION=${{ needs.prepare.outputs.version }}
          IMAGE_TAG="${{ env.NEXUS_URL }}:${{ env.NEXUS_PORT }}/${{ env.APP_NAME }}:${VERSION}"
          
          # Conectar por SSH y ejecutar deployment
          ssh -i ~/.ssh/deploy-key -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            set -e
            echo "📦 Deployando versión ${VERSION}..."
            
            # Ir al directorio de la aplicación
            cd /home/ubuntu/app-fastapi
            
            # Login a Nexus desde EC2
            echo "${{ secrets.NEXUS_PASSWORD }}" | docker login ${{ env.NEXUS_URL }}:${{ env.NEXUS_PORT }} -u "${{ secrets.NEXUS_USERNAME }}" --password-stdin
            
            # Crear archivo .env con la nueva versión
            cat > .env << ENV_EOF
          IMAGE_TAG=${IMAGE_TAG}
          APP_VERSION=${VERSION}
          ENVIRONMENT=production
          ENV_EOF
            
            # Descargar docker-compose actualizado
            curl -f -o docker-compose.prod.yaml https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.prod.yaml
            
            # Actualizar la aplicación
            echo "🔄 Actualizando aplicación..."
            docker-compose -f docker-compose.prod.yaml pull store-api
            docker-compose -f docker-compose.prod.yaml up -d --remove-orphans
            
            # Limpiar imágenes viejas
            docker image prune -f
            
            echo "✅ Deployment completado!"
          EOF
          
      - name: 🏥 Verificar que la aplicación funciona
        run: |
          echo "⏳ Esperando a que la aplicación esté lista..."
          sleep 30
          
          # Verificar que la aplicación responde
          for i in {1..5}; do
            if curl -f http://${{ secrets.EC2_HOST }}:8000/health; then
              echo "✅ Aplicación funcionando correctamente!"
              break
            else
              echo "⚠️ Intento $i/5 - esperando..."
              sleep 10
            fi
          done

  # ---------------------------------------------------------------------------
  # JOB 7: CLEANUP - Limpiar archivos temporales
  # ---------------------------------------------------------------------------
  cleanup:
    name: 🧹 Limpiar
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    
    steps:
      - name: 🗑️ Eliminar artefactos temporales
        uses: geekyeggo/delete-artifact@v2
        with:
          name: docker-image
          failOnError: false
          
      - name: 🎉 Resumen final
        run: |
          echo "🎉 ¡Pipeline completado!"
          echo "📦 Versión desplegada: ${{ needs.prepare.outputs.version }}"
          echo "🌐 Aplicación disponible en: http://${{ secrets.EC2_HOST }}:8000"
          echo "📊 Métricas en: http://${{ secrets.EC2_HOST }}:8000/metrics"
          echo "📈 Prometheus: http://${{ secrets.EC2_HOST }}:9090"
          echo "📊 Grafana: http://${{ secrets.EC2_HOST }}:3000" 

          # En tu EC2, ejecutas UNA VEZ:
          docker-compose -f docker-compose.prod.yaml up -d