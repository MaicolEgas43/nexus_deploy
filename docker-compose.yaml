# Docker Compose para Store Management API - Proyecto DevOps
# Incluye: FastAPI, PostgreSQL, Prometheus, Grafana, Nexus

services:
  # Aplicación FastAPI (servicio principal)
  fastapi-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: store-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/store
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network
      - monitor-net
    restart: unless-stopped
    depends_on:
      - postgres
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8000"
      - "prometheus.path=/metrics"
    volumes:
      - ./data:/app/data

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: store
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Corregido: postgres_data
    networks:
      - app-network
    restart: unless-stopped

  # Prometheus para métricas
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitor-net
    restart: unless-stopped

  # Grafana para visualización
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitor-net
    restart: unless-stopped

  # Nexus Repository Manager
  nexus:
    image: sonatype/nexus3:latest
    container_name: nexus-repository
    ports:
      - "8081:8081"
    volumes:
      - nexus_data:/nexus-data  # Corregido: nexus_data
    networks:
      - app-network
    restart: unless-stopped


volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  nexus_data:

# Redes organizadas por funcion   
networks:
  app-network:      
    driver: bridge
  monitor-net:
    driver: bridge