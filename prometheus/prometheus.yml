global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Monitorear Prometheus a sí mismo
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Monitorear tu aplicación FastAPI
  - job_name: 'fastapi-app'
    static_configs:
      - targets: ['app-fastapi:80']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Monitorear Grafana
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    scrape_interval: 60s

  # Monitorear Nexus
  - job_name: 'nexus'
    static_configs:
      - targets: ['nexus:8081']
    metrics_path: '/service/metrics/prometheus'
    scrape_interval: 60s