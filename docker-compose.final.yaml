# =============================================================================
# Docker Compose FINAL - Con Nexus Configurado
# Usar DESPUÉS de configurar Docker registry en Nexus
# =============================================================================

version: '3.8'

services:
  # =============================================================================
  # TU APLICACIÓN PRINCIPAL - Store Management API
  # =============================================================================
  app-fastapi:
    # DESPUÉS de configurar Nexus, cambiar a:
    # image: ${IMAGE_TAG:-ec2-13-223-57-61.compute-1.amazonaws.com:8082/app-fastapi:latest}
    image: ${IMAGE_TAG:-nginx:alpine}
    container_name: app-fastapi-prod
    ports:
      - "8000:80"
    environment:
      - ENVIRONMENT=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network
      - monitoring-network
    restart: unless-stopped
    depends_on:
      - postgres
    # Labels para que Prometheus pueda encontrar tu app
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=80"
      - "prometheus.path=/metrics"
    volumes:
      - app_data:/app/data

  # =============================================================================
  # BASE DE DATOS - PostgreSQL
  # =============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: postgres-prod
    environment:
      POSTGRES_DB: store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

  # =============================================================================
  # MONITOREO - Prometheus (Recolecta métricas)
  # =============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-prod
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring-network
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'  # Guardar datos por 30 días

  # =============================================================================
  # VISUALIZACIÓN - Grafana (Dashboards bonitos)
  # =============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-prod
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      # Configuración básica
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring-network
    restart: unless-stopped

  # =============================================================================
  # REGISTRY - Nexus (Tu biblioteca de imágenes Docker)
  # =============================================================================
  nexus:
    image: sonatype/nexus3:latest
    container_name: nexus-prod
    ports:
      - "8081:8081"    # Interface web
      - "8082:8082"    # Docker registry (configurar en Nexus)
    volumes:
      - nexus_data:/nexus-data
    networks:
      - app-network
    restart: unless-stopped
    environment:
      - NEXUS_SECURITY_RANDOMPASSWORD=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/service/rest/v1/status"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s

# =============================================================================
# NETWORKS - Conectividad entre servicios
# =============================================================================
networks:
  app-network:
    driver: bridge
    name: app-network
  monitoring-network:
    driver: bridge
    name: monitoring-network

# =============================================================================
# VOLUMES - Persistencia de datos
# =============================================================================
volumes:
  postgres_data:
    name: postgres_data
  prometheus_data:
    name: prometheus_data
  grafana_data:
    name: grafana_data
  nexus_data:
    name: nexus_data
  app_data:
    name: app_data 